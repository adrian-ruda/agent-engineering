name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Sin fail-fast: si el suite rompe solo en el piso de versión, queremos
      # ver TAMBIÉN el resultado de la otra. Un cancel automático esconde
      # justo la mitad del dato que hace falta para diagnosticar.
      fail-fast: false
      matrix:
        # 3.10 es el PISO REAL, no una elección de gusto: las anotaciones del
        # engine usan uniones PEP 604 (`Path | None`) evaluadas en tiempo de
        # `def`, así que 3.9 explota al importar el módulo.
        # 3.13 es el techo actual soportado.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # Los 8 tests end-to-end del gate lanzan `bash engine/sdd_apply_gate.sh`,
      # que a su vez llama a `python3`. setup-python pone SU intérprete al
      # frente del PATH como `python` y como `python3`, así que el subproceso
      # corre en la versión de la matriz y no en el python del sistema.
      # Sin esta verificación, esos 8 tests podrían estar validando siempre el
      # mismo intérprete y la matriz sería decorativa.
      - name: Verify python3 resolves to the matrix interpreter
        run: |
          python3 -c 'import sys; print(sys.version)'
          python3 -c 'import sys; assert sys.version_info[:2] == tuple(int(x) for x in "${{ matrix.python-version }}".split(".")), sys.version'

      - name: Run test suite
        run: python -m pytest engine/tests -q
